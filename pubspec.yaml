name: eloquent
version: 4.0.0
description: >-
  Laravel-style (Eloquent 5.2) query builder, schema builder and migrations
  for Dart, with PostgreSQL and MySQL drivers.
homepage: https://github.com/insinfo/eloquent_dart
repository: https://github.com/insinfo/eloquent_dart
issue_tracker: https://github.com/insinfo/eloquent_dart/issues
documentation: https://github.com/insinfo/eloquent_dart#readme
topics:
  - database
  - orm
  - query-builder
  - postgresql
  - mysql

environment:
  sdk: ^3.6.0
  
publish_to: none

dependencies:  
  intl: '>=0.17.0 <3.0.0'
  collection: ^1.19.1
  meta: ^1.17.0
  path: ^1.9.1

  dargres: ^4.0.1
  dpgsql: ^1.0.3
  # postgres v2
  postgres_fork: ^3.0.0
  mysql_dart: ^3.0.1
  # postgres v3
  postgres: ^3.5.4

executables:
  eloquent:

dev_dependencies:
  test: ^1.17.12   
